name: kafka-final-project

x-kafka-environment: &kafka-environment
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_SSL,EXTERNAL:SASL_SSL,CONTROLLER:SASL_PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
  KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
  KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
  KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="broker" password="broker-secret"
    user_admin="admin-secret" user_broker="broker-secret"
    user_order_service="order-secret" user_payment_service="payment-secret"
    user_notification_service="notification-secret" user_auditor="auditor-secret"
    user_monitoring="monitoring-secret" user_guest="guest-secret";
  KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="broker" password="broker-secret"
    user_admin="admin-secret" user_broker="broker-secret"
    user_order_service="order-secret" user_payment_service="payment-secret"
    user_notification_service="notification-secret" user_auditor="auditor-secret"
    user_monitoring="monitoring-secret" user_guest="guest-secret";
  KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: >-
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="controller" password="controller-secret"
    user_controller="controller-secret";
  KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
  KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
  KAFKA_SUPER_USERS: User:admin;User:broker;User:controller
  KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka.keystore.p12
  KAFKA_SSL_KEYSTORE_PASSWORD: changeit
  KAFKA_SSL_KEY_PASSWORD: changeit
  KAFKA_SSL_KEYSTORE_TYPE: PKCS12
  KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka.truststore.p12
  KAFKA_SSL_TRUSTSTORE_PASSWORD: changeit
  KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
  KAFKA_SSL_CLIENT_AUTH: none
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_OPTS: -javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent.jar=7071:/opt/jmx-exporter/config.yml
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

x-kafka-service: &kafka-service
  build:
    context: .
    dockerfile: Dockerfile.kafka
  restart: unless-stopped
  volumes:
    - ./runtime/secrets:/etc/kafka/secrets:ro
    - ./config/clients:/etc/kafka/client:ro
  networks:
    - kafka-net

services:
  kafka-1:
    <<: *kafka-service
    hostname: kafka-1
    ports:
      - "19092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:19092
    volumes:
      - kafka-1-data:/var/lib/kafka/data
      - ./runtime/secrets:/etc/kafka/secrets:ro
      - ./config/clients:/etc/kafka/client:ro
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_OPTS= kafka-broker-api-versions --bootstrap-server kafka-1:29092 --command-config /etc/kafka/client/admin.properties >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  kafka-2:
    <<: *kafka-service
    hostname: kafka-2
    ports:
      - "29092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:29092
    volumes:
      - kafka-2-data:/var/lib/kafka/data
      - ./runtime/secrets:/etc/kafka/secrets:ro
      - ./config/clients:/etc/kafka/client:ro
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_OPTS= kafka-broker-api-versions --bootstrap-server kafka-2:29092 --command-config /etc/kafka/client/admin.properties >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  kafka-3:
    <<: *kafka-service
    hostname: kafka-3
    ports:
      - "39092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:39092
    volumes:
      - kafka-3-data:/var/lib/kafka/data
      - ./runtime/secrets:/etc/kafka/secrets:ro
      - ./config/clients:/etc/kafka/client:ro
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_OPTS= kafka-broker-api-versions --bootstrap-server kafka-3:29092 --command-config /etc/kafka/client/admin.properties >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    restart: unless-stopped
    command:
      - --kafka.server=kafka-1:29092
      - --kafka.server=kafka-2:29092
      - --kafka.server=kafka-3:29092
      - --sasl.enabled
      - --sasl.username=monitoring
      - --sasl.password=monitoring-secret
      - --sasl.mechanism=plain
      - --tls.enabled
      - --tls.ca-file=/etc/kafka/secrets/ca.crt
      - --topic.filter=orders|payments|notifications|audit-events
    volumes:
      - ./runtime/secrets:/etc/kafka/secrets:ro
    networks:
      - kafka-net

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - kafka-net

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - kafka-net

networks:
  kafka-net:

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  prometheus-data:
  grafana-data:
